<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CarrierBasis Demo — From Dispatch Board to Sealed Record in About a Minute</title>
<meta name="description" content="Watch CarrierBasis vet tomorrow's loads in the background, then take one clean load from READY to a sealed compliance record: a click, a sentence, a click.">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="canonical" href="https://carrierbasis.com/demo.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --nw-blue:#305D94; --nw-dark:#1F487C; --nw-action:#3182CE; --nw-orange:#ED8936;
    --ink-navy:#14273F; --charcoal:#1A202C; --gray-med:#4A5568; --gray-line:#E2E8F0;
    --paper:#F7FAFC; --white:#fff; --green:#2F7D53;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--sans);background:linear-gradient(168deg,var(--ink-navy),var(--nw-dark));min-height:100vh;color:var(--charcoal);display:flex;flex-direction:column;align-items:center;padding:28px 16px 40px}
  a{color:var(--nw-action)}
  a:focus-visible,button:focus-visible{outline:3px solid #9DBBDD;outline-offset:2px}

  .head{width:100%;max-width:880px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px;color:#fff}
  .wordmark{font-weight:800;font-size:18px;display:flex;align-items:center}
  .topbar-logo{height:28px;width:auto}
  .wordmark span{color:#9DBBDD}
  .head .note{font-size:12.5px;color:#9DBBDD}

  .stage-wrap{width:100%;max-width:880px}
  .app{background:var(--white);border-radius:12px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.45);min-height:430px;display:flex;flex-direction:column}
  .app-top{background:var(--paper);border-bottom:1px solid var(--gray-line);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .app-top .t{font-weight:700;color:var(--nw-dark);font-size:15px}
  .app-top .m{font-family:var(--mono);font-size:11.5px;color:var(--gray-med)}
  .app-body{padding:20px;flex:1}
  .scene{animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.scene{animation:none}}

  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:14px}
  .tile{border:1px solid var(--gray-line);border-radius:8px;padding:12px 14px;background:#fff}
  .tile .l{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--gray-med);margin-bottom:6px}
  .tile .v{font-size:13.5px;color:var(--charcoal);line-height:1.45}
  .tile .v .mono{font-family:var(--mono);font-size:12px}
  .ok{color:var(--green);font-family:var(--mono);font-size:12px}
  .flag{color:#B7791F;font-family:var(--mono);font-size:12px}

  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border:1px solid var(--gray-line);border-radius:8px;padding:12px 14px;margin-bottom:10px;background:#fff}
  .row .txt b{font-size:13.5px;color:var(--charcoal);display:block;margin-bottom:3px}
  .row .txt p{font-size:12.8px;color:var(--gray-med);line-height:1.5;max-width:38em}
  .row .st{font-family:var(--mono);font-size:11.5px;white-space:nowrap}
  .pass{color:var(--green)} .rev{color:#B7791F} .resolved{color:var(--green)}

  .btn{display:inline-block;border:0;border-radius:7px;padding:10px 18px;font-family:var(--sans);font-weight:600;font-size:13.5px;cursor:default;text-decoration:none}
  .btn-p{background:var(--nw-action);color:#fff}
  .btn-o{background:transparent;border:1.5px solid var(--gray-line);color:var(--gray-med)}
  .pulse{position:relative}
  .pulse::after{content:"";position:absolute;inset:-5px;border:2px solid var(--nw-action);border-radius:10px;animation:pulse 1.1s ease-out infinite}
  @keyframes pulse{0%{opacity:.9;transform:scale(.97)}70%{opacity:0;transform:scale(1.06)}100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.pulse::after{animation:none;opacity:.9}}

  .comment{border:1px solid var(--gray-line);border-radius:8px;background:var(--paper);padding:12px 14px;font-size:13.5px;color:var(--charcoal);min-height:64px;font-style:italic;line-height:1.55}
  .caret{display:inline-block;width:8px;border-bottom:2px solid var(--nw-action);animation:blink 1s steps(1) infinite;margin-left:1px}
  @keyframes blink{50%{opacity:0}}

  .sealcard{background:#FDFDFB;border:1px solid var(--gray-line);border-radius:10px;padding:18px 20px;max-width:520px}
  .sealcard .sh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--gray-line);padding-bottom:10px;margin-bottom:10px}
  .sealcard .sh b{color:var(--nw-dark);font-size:13px;letter-spacing:.02em}
  .sealcard .sh .m{font-family:var(--mono);font-size:11px;color:var(--gray-med);margin-top:3px}
  .chip{font-family:var(--mono);font-size:10.5px;font-weight:500;background:var(--nw-orange);color:#3D2308;border-radius:4px;padding:3px 8px;letter-spacing:.06em}
  .sealcard .hash{font-family:var(--mono);font-size:11px;color:var(--gray-med);border-top:1px solid var(--gray-line);margin-top:10px;padding-top:9px;overflow-wrap:anywhere}
  .sealcard .q{border-left:3px solid var(--nw-blue);padding-left:10px;font-size:12.5px;color:var(--gray-med);font-style:italic;margin:10px 0}

  .caption{width:100%;max-width:880px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:10px;margin-top:14px;padding:14px 18px;color:#fff;display:flex;gap:14px;align-items:flex-start}
  .who{flex:0 0 auto;font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.07em;border-radius:4px;padding:4px 9px;margin-top:2px}
  .who-sys{background:rgba(157,187,221,.22);color:#C9DBEF}
  .who-brk{background:var(--nw-action);color:#fff}
  .caption .ct b{display:block;font-size:14.5px;margin-bottom:3px}
  .caption .ct p{font-size:13px;color:#C6D6E8;line-height:1.55;max-width:58em}

  .controls{width:100%;max-width:880px;display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:12px;flex-wrap:wrap}
  .dots{display:flex;gap:7px}
  .dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.25);border:0;cursor:pointer;padding:0}
  .dot[aria-current="true"]{background:#fff}
  .cbtns{display:flex;gap:8px}
  .cbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:7px;padding:8px 14px;font-family:var(--sans);font-weight:600;font-size:13px;cursor:pointer}
  .cbtn:hover{background:rgba(255,255,255,.18)}
  .ledger{font-family:var(--mono);font-size:12px;color:#9DBBDD}
  .ledger b{color:#fff;font-weight:500}

  .end-ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
  .end-ctas .btn{cursor:pointer}
  .endnote{margin-top:14px;font-size:12.5px;color:var(--gray-med)}
</style>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-063XHMYB9K"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-063XHMYB9K');
</script>
</head>
<body>

<div class="head">
  <div class="wordmark" aria-label="CarrierBasis demo"><svg class="topbar-logo" viewBox="0 0 300 60" role="img" aria-label="CarrierBasis" xmlns="http://www.w3.org/2000/svg"><g transform="translate(0,6) scale(0.48)"><path d="M16 0 H66 L100 34 V84 A16 16 0 0 1 84 100 H16 A16 16 0 0 1 0 84 V16 A16 16 0 0 1 16 0 Z" fill="#FFFFFF"></path><path d="M66 0 L100 34 H66 Z" fill="#EF8B44"></path><text x="48" y="76" text-anchor="middle" font-family="Archivo, Helvetica, sans-serif" font-size="52" font-weight="700" letter-spacing="-2"><tspan fill="#16263F">C</tspan><tspan fill="#5B7EA6">B</tspan></text></g><text x="62" y="41" font-family="Archivo, Helvetica, sans-serif" font-size="30" font-weight="500" letter-spacing="-0.9" fill="#FFFFFF">Carrier<tspan font-weight="700">Basis</tspan></text></svg><span style="font-weight:500;font-size:13px;color:#C6D6E8;margin-left:6px">· demo</span></div>
  <div class="note">Illustrative walkthrough · interface simplified · all data fictional</div>
</div>

<div class="stage-wrap">
  <div class="app" aria-live="polite">
    <div class="app-top">
      <div><span class="t" id="app-title">Dispatch Readiness</span></div>
      <div class="m" id="app-meta">Tomorrow's assigned loads · synced from your TMS</div>
    </div>
    <div class="app-body"><div class="scene" id="stage"></div></div>
  </div>
</div>

<div class="caption">
  <span class="who who-sys" id="who">SYSTEM</span>
  <div class="ct"><b id="cap-t"></b><p id="cap-p"></p></div>
</div>

<div class="controls">
  <div class="cbtns">
    <button class="cbtn" id="prev" aria-label="Previous step">← Back</button>
    <button class="cbtn" id="play" aria-label="Pause autoplay">Pause</button>
    <button class="cbtn" id="next" aria-label="Next step">Next →</button>
  </div>
  <div class="dots" id="dots" role="tablist" aria-label="Demo steps"></div>
  <div class="ledger">Broker actions: <b id="count">0</b> · everything else is automatic</div>
</div>

<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const stage = $("#stage"), capT = $("#cap-t"), capP = $("#cap-p"), who = $("#who"),
      appTitle = $("#app-title"), appMeta = $("#app-meta"), countEl = $("#count");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const row = (b, p, st, cls) =>
  `<div class="row"><div class="txt"><b>${b}</b><p>${p}</p></div><span class="st ${cls}">${st}</span></div>`;

const SCENES = [
{ t:"Dispatch Readiness", m:"Tomorrow's assigned loads · synced from your TMS", actor:"sys", dur:9000,
  ct:"You haven't clicked anything yet",
  cp:"CarrierBasis read the TMS, matched each load to the carrier actually on it, refreshed the facts, and ran your policy — in the background. Three loads ready for your judgment. One routed for review. Broker effort so far: zero.",
  html: row("LD-20260729-121 · Blue Ash Transport LLC","Joliet, IL → Indianapolis, IN · consumer packaged goods · declared $64,000","READY · vetted 09:11","pass")
      + row("LD-20260728-114 · Meridian Haulage LLC","Elgin, IL → Columbus, OH · declared $180,000 · high-value tier","NEEDS REVIEW · 2 items","rev")
      + row("LD-20260729-118 · Halstead Carriers Inc.","Peoria, IL → Louisville, KY · declared $38,000","READY · vetted 09:11","pass")
      + row("LD-20260729-125 · Kestrel Freight Lines LLC","Madison, WI → Grand Rapids, MI · declared $52,000","READY · vetted 09:12","pass") },

{ t:"Dispatch Readiness", m:"Open a ready load", actor:"brk", act:1, dur:5000,
  ct:"Broker action 1 — one click",
  cp:"READY means the checks pass on current facts and the load is waiting on the only thing CarrierBasis never supplies: your judgment.",
  mutate: (st)=>{
    const r = st.querySelector(".row");
    if(!r) return;
    r.classList.add("pulse");
    const s2 = r.querySelector(".st");
    if(s2) s2.textContent = "OPEN →";
  },
  html: row("LD-20260729-121 · Blue Ash Transport LLC","Joliet, IL → Indianapolis, IN · consumer packaged goods · declared $64,000","OPEN →","pass").replace('class="row"','class="row pulse"')
      + row("LD-20260728-114 · Meridian Haulage LLC","Elgin, IL → Columbus, OH · declared $180,000 · high-value tier","NEEDS REVIEW · 2 items","rev")
      + row("LD-20260729-118 · Halstead Carriers Inc.","Peoria, IL → Louisville, KY · declared $38,000","READY · vetted 09:11","pass")
      + row("LD-20260729-125 · Kestrel Freight Lines LLC","Madison, WI → Grand Rapids, MI · declared $52,000","READY · vetted 09:12","pass") },

{ t:"Compliance File — LD-20260729-121", m:"Blue Ash Transport LLC · MC-0000001", actor:"sys", dur:10000,
  ct:"Everything was assembled before you arrived",
  cp:"Two federal sources, your TMS, the insurance certificate, and the monitoring report your team uploaded — pulled, read, cross-checked, and timestamped this morning. Every policy rule evaluated against those facts, safety rating included. Nothing for you to gather, nothing to chase, nothing left unchecked.",
  html: row("FMCSA — authority &amp; identity","Operating authority active · legal name and MC/DOT verified against the federal record","<span class='mono'>09:11:36 ✓</span>","pass")
      + row("FMCSA — safety record","Rating Satisfactory · inspection and crash history pulled · no adverse indicators","<span class='mono'>09:11:39 ✓</span>","pass")
      + row("TMS record","Carrier active · signed agreement on file · insurance verification current","<span class='mono'>09:11:44 ✓</span>","pass")
      + row("Certificate of insurance","Extracted from the uploaded COI: cargo $100,000 · auto liability $1,000,000 · re-verified against the TMS","<span class='mono'>09:11:49 ✓</span>","pass")
      + row("Uploaded monitoring report","Your Carrier411 report, uploaded by your team — read and summarized: no adverse reports or fraud indicators on file","<span class='mono'>09:11:52 ✓</span>","pass")
      + row("Broker policy v4 — standard tier","Authority · identity · agreement · no adverse safety rating · cargo $100,000 vs. declared $64,000 · auto ≥ $1M · valid through delivery","PASS — ALL RULES","pass")
      + row("Findings","No items require review on current facts","NONE","pass") },

{ t:"Basis + approve", m:"Required before sealing", actor:"brk", act:3, dur:9500,
  ct:"Broker actions 2 and 3 — one sentence, one click",
  cp:"Approval is impossible without your written basis — attributed to you, dated to the second. That sentence is what answers \u201Con what basis?\u201D years from now. Then approve. That's the whole job.",
  html: `<div class="comment" id="typebox"></div>
         <div style="margin-top:12px"><span class="btn btn-p pulse">Approve for this load</span>&nbsp;&nbsp;<span class="btn btn-o">Cancel</span></div>`,
  type:"All checks pass on current facts; cargo coverage exceeds declared value and runs through delivery. Approved for this load." },

{ t:"Sealed", m:"CF-20260729-121", actor:"sys", dur:8000,
  ct:"Sealed — automatically, about a minute after you opened it",
  cp:"The complete record — sources, timestamps, policy snapshot, your reasoning, your identity — locked and fingerprinted with SHA-256. Later verification can confirm it hasn't changed since this moment.",
  html: `<div class="sealcard">
          <div class="sh"><div><b>CARRIER COMPLIANCE RECORD</b><div class="m">Blue Ash Transport LLC · MC-0000001 · LD-20260729-121</div></div><span class="chip">SEALED</span></div>
          <div class="q">"All checks pass on current facts; cargo coverage exceeds declared value and runs through delivery. Approved for this load."</div>
          <div class="hash">SHA-256 5c81f2b7…03a9e4 · Sealed Jul 29, 2026 · 09:12:58 CT · Reviewer: D. Alvarez (authenticated)</div>
         </div>` },

{ t:"The ledger", m:"Start to seal", actor:"sys", dur:999999,
  ct:"Total broker effort: 3 actions — a click, a sentence, a click",
  cp:"Everything else was automatic: the TMS reconciliation, the background vetting, the source pulls, the policy tiers, the assembly, the seal. Policy compliance that survives a busy Friday — and the evidence writes itself. The flagged load? Same flow, plus two guided judgment calls. See how that record reads:",
  html: row("Broker","Opened the load · wrote one sentence · approved","3 ACTIONS","pass")
      + row("CarrierBasis","Synced the TMS · vetted 4 loads in the background · refreshed sources · read uploaded reports · applied policy · assembled &amp; sealed the record","AUTOMATIC","pass")
      + `<div class="end-ctas">
           <a class="btn btn-p" href="carrierbasis-sample-compliance-record.pdf">See a record with findings — sample PDF</a>
           <a class="btn btn-o" style="color:var(--nw-dark);border-color:var(--nw-blue)" href="mailto:contact@workanewway.com?subject=CarrierBasis%20walkthrough">Book a walkthrough</a>
           <a class="btn btn-o" style="color:var(--nw-dark);border-color:var(--nw-blue)" href="./">Back to CarrierBasis</a>
         </div>
         <p class="endnote">All names, numbers, and events in this demo are fictional. Interface simplified for illustration. READY means checks pass on current facts — the decision is always the broker's.</p>` },
];

let idx = 0, lastIdx = -1, timer = null, playing = !reduced, typeTimer = null;

const dots = $("#dots");
SCENES.forEach((s,i)=>{
  const d = document.createElement("button");
  d.className = "dot"; d.setAttribute("role","tab");
  d.setAttribute("aria-label","Step "+(i+1)+": "+s.ct);
  d.addEventListener("click", ()=>go(i,true));
  dots.appendChild(d);
});

function typeInto(el, text){
  if(reduced){ el.textContent = "\u201C"+text+"\u201D"; return; }
  let i = 0; el.innerHTML = '<span id="typed"></span><span class="caret"></span>';
  const typed = el.querySelector("#typed");
  typed.textContent = "\u201C";
  typeTimer = setInterval(()=>{
    typed.textContent = "\u201C" + text.slice(0, ++i);
    if(i >= text.length){ clearInterval(typeTimer); typed.textContent = "\u201C"+text+"\u201D"; el.querySelector(".caret").remove(); }
  }, 34);
}

function render(){
  const s = SCENES[idx];
  clearInterval(typeTimer);
  appTitle.textContent = s.t; appMeta.textContent = s.m;
  capT.textContent = s.ct; capP.textContent = s.cp;
  who.textContent = s.actor === "sys" ? "SYSTEM" : "BROKER";
  who.className = "who " + (s.actor === "sys" ? "who-sys" : "who-brk");
  countEl.textContent = s.act || (idx===0?0:Math.max(...SCENES.slice(0,idx+1).map(x=>x.act||0)));
  if(s.mutate && lastIdx === idx-1 && stage.firstChild){
    s.mutate(stage);            // continue the previous scene's DOM in place — no fade, no rebuild
  } else {
    stage.innerHTML = "";
    const div = document.createElement("div"); div.className = "scene"; div.innerHTML = s.html;
    stage.appendChild(div);
    if(s.type){ typeInto(div.querySelector("#typebox"), s.type); }
  }
  lastIdx = idx;
  [...dots.children].forEach((d,i)=>d.setAttribute("aria-current", i===idx ? "true":"false"));
  schedule();
}

function schedule(){
  clearTimeout(timer);
  if(playing && idx < SCENES.length-1){
    timer = setTimeout(()=>{ idx++; render(); }, SCENES[idx].dur);
  }
}

function go(i, manual){
  idx = Math.max(0, Math.min(SCENES.length-1, i));
  if(manual && playing){ /* keep playing from the chosen step */ }
  render();
}

$("#next").addEventListener("click", ()=>go(idx+1,true));
$("#prev").addEventListener("click", ()=>go(idx-1,true));
$("#play").addEventListener("click", function(){
  playing = !playing;
  this.textContent = playing ? "Pause" : "Play";
  this.setAttribute("aria-label", playing ? "Pause autoplay" : "Resume autoplay");
  schedule();
});
document.addEventListener("keydown", e=>{
  if(e.key==="ArrowRight") go(idx+1,true);
  if(e.key==="ArrowLeft") go(idx-1,true);
});

if(reduced){ playing = false; $("#play").textContent = "Play"; }
render();
})();
</script>
</body>
</html>
